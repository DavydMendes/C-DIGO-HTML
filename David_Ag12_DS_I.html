<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titulo que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Estilos para organizar e melhorar a aparencia -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #17365d;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .site {
            background-color: white;
            width: 220px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .site img {
            width: 100%;
            height: 120px;
            object-fit: contain;
        }

        .site a {
            color: #0759a5;
            text-decoration: none;
        }

        .site a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Titulo principal da pagina -->
    <h1>Meus sites favoritos: David Mendes Santos</h1>

    <p>Sites que utilizo para estudar, trabalhar e me divertir.</p>

    <!-- Area que organiza os cinco sites -->
    <div class="container">

        <!-- Primeiro site: Google -->
        <div class="site">
            <h2>Google</h2>
            <a href="https://www.google.com/" target="_blank">
                <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
                     alt="Logo do Google">
            </a>
            <p><a href="https://www.google.com/" target="_blank">Acessar Google</a></p>
        </div>

        <!-- Segundo site: YouTube -->
        <div class="site">
            <h2>YouTube</h2>
            <a href="https://www.youtube.com/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg"
                     alt="Logo do YouTube">
            </a>
            <p><a href="https://www.youtube.com/" target="_blank">Acessar YouTube</a></p>
        </div>

        <!-- Terceiro site: GitHub -->
        <div class="site">
            <h2>GitHub</h2>
            <a href="https://github.com/" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png"
                     alt="Logo do GitHub">
            </a>
            <p><a href="https://github.com/" target="_blank">Acessar GitHub</a></p>
        </div>

        <!-- Quarto site: LinkedIn -->
        <div class="site">
            <h2>LinkedIn</h2>
            <a href="https://www.linkedin.com/" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png"
                     alt="Logo do LinkedIn">
            </a>
            <p><a href="https://www.linkedin.com/" target="_blank">Acessar LinkedIn</a></p>
        </div>

        <!-- Quinto site: Instagram -->
        <div class="site">
            <h2>Instagram</h2>
            <a href="https://www.instagram.com/" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png"
                     alt="Logo do Instagram">
            </a>
            <p><a href="https://www.instagram.com/" target="_blank">Acessar Instagram</a></p>
        </div>

    </div> <!-- Fecha a div do container -->
</body> <!-- Fecha o body -->
</html> <!-- Fecha o html -->
